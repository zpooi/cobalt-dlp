# 可选：YouTube PO Token 服务（bgutil）。
# 机房/海外 IP 上 YouTube 可能只返回受限流，报 "Requested format is not available"，
# 加上这个服务后可以让 yt-dlp 生成 PO Token。
#
# 用法（两个文件一起用）：
#   docker compose -f docker-compose.yml -f docker-compose.pot.yml up -d --build
#
# 不需要时忽略本文件，README 里的普通启动方式照常使用。

services:
  savebox:
    environment:
      POT_PROVIDER_URL: "http://bgutil-provider:4416"
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    init: true
    expose:
      - "4416"
