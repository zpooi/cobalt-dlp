<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f7fb" />
<title>SaveBox · 服务器下载站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f6ef7'/%3E%3Cpath d='M16 8v10m-5-4 5 5 5-5M9 23h14' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f6f7fb;
    --surface:#ffffff;
    --surface-2:#f8f9fe;
    --line:#e8ecf5;
    --line-strong:#dfe5f2;
    --text:#161b2a;
    --text-2:#3b4460;
    --muted:#6b7390;
    --muted-2:#9aa2b8;
    --accent:#4f6ef7;
    --accent-2:#8b5cf6;
    --ok:#0f9d6e;
    --ok-bg:#e6f8f0;
    --err:#e0385f;
    --err-bg:#fdeef2;
    --warn:#c97a00;
    --warn-bg:#fff6e5;
    --radius:20px;
    --shadow-sm:0 1px 2px rgba(23,28,43,.05), 0 4px 14px rgba(23,28,43,.04);
    --shadow-md:0 2px 6px rgba(23,28,43,.04), 0 16px 40px rgba(79,110,247,.10);
    --shadow-lg:0 24px 70px rgba(23,28,43,.20);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    background:
      radial-gradient(900px 520px at 88% -8%, rgba(139,92,246,.13), transparent 62%),
      radial-gradient(760px 460px at 2% 4%, rgba(79,110,247,.13), transparent 58%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button,.ico-btn,select,input{touch-action:manipulation}
  ::selection{background:rgba(79,110,247,.18)}

  .wrap{
    max-width:880px;margin:0 auto;
    padding:44px 20px calc(80px + env(safe-area-inset-bottom));
    padding-left:calc(20px + env(safe-area-inset-left));
    padding-right:calc(20px + env(safe-area-inset-right));
  }

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
  .logo{
    width:48px;height:48px;border-radius:15px;flex:none;
    background:linear-gradient(140deg,#5b7bff,#8b5cf6);
    display:grid;place-items:center;
    box-shadow:0 10px 24px rgba(79,110,247,.30), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .logo svg{width:24px;height:24px}
  .brand{min-width:0}
  h1{font-size:21px;font-weight:700;letter-spacing:-.3px;margin:0;line-height:1.2}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 0}
  .engine{
    margin-left:auto;display:flex;align-items:center;gap:8px;white-space:nowrap;
    font-size:12px;color:var(--muted);font-weight:500;
    background:rgba(255,255,255,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:999px;padding:8px 13px;
    box-shadow:var(--shadow-sm);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(15,157,110,.14)}
  .dot.bad{background:var(--err);box-shadow:0 0 0 3px rgba(224,56,95,.14)}

  /* ---------- composer ---------- */
  .input-card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:22px;padding:16px;box-shadow:var(--shadow-md);
  }
  .composer{display:flex;gap:10px;flex-wrap:wrap}
  .field{
    flex:1 1 300px;display:flex;align-items:center;gap:10px;height:54px;
    padding:0 15px;border-radius:15px;background:var(--surface-2);
    border:1px solid var(--line);transition:border-color .18s, box-shadow .18s, background .18s;
  }
  .field:focus-within{border-color:#b7c4ff;background:#fff;box-shadow:0 0 0 4px rgba(79,110,247,.12)}
  .field > svg{width:18px;height:18px;color:var(--muted-2);flex:none}
  .field input{
    flex:1;min-width:0;border:0;outline:none;background:none;
    font-size:15px;color:var(--text);font-family:inherit;
  }
  .field input::placeholder{color:var(--muted-2)}
  select{
    height:54px;padding:0 38px 0 14px;font-size:14.5px;font-family:inherit;
    color:var(--text-2);font-weight:500;background:#fff;
    border:1px solid var(--line);border-radius:15px;outline:none;
    appearance:none;cursor:pointer;transition:border-color .18s, box-shadow .18s;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='%239aa2b8'><path d='M4 6l4 4 4-4z'/></svg>");
    background-repeat:no-repeat;background-position:right 13px center;
  }
  select:hover{border-color:var(--line-strong)}
  select:focus{border-color:#b7c4ff;box-shadow:0 0 0 4px rgba(79,110,247,.12)}
  .btn{
    height:54px;padding:0 28px;font-size:15px;font-weight:600;font-family:inherit;
    color:#fff;border:none;border-radius:15px;cursor:pointer;white-space:nowrap;
    background:linear-gradient(135deg,#4f6ef7,#7c5cf5);
    box-shadow:0 10px 24px rgba(79,110,247,.28), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .16s, box-shadow .16s, filter .16s;
  }
  .btn:hover{filter:brightness(1.05);box-shadow:0 12px 28px rgba(79,110,247,.34), inset 0 1px 0 rgba(255,255,255,.25)}
  .btn:active{transform:translateY(1px) scale(.995)}
  .btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none;filter:none}
  /* 支持平台一行：文字 + 品牌 logo + 数量 */
  .support{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    margin:15px 3px 0;color:var(--muted);font-size:12.5px;line-height:1.6;
  }
  .support b{color:var(--text-2);font-weight:600}
  .plats{display:flex;align-items:center;gap:6px}
  .plat{
    width:27px;height:27px;border-radius:9px;background:#fff;
    border:1px solid var(--line);display:grid;place-items:center;
    color:#8b93ab;transition:transform .16s, box-shadow .16s, border-color .16s;
  }
  .plat svg{width:15px;height:15px;fill:currentColor;display:block}
  .plat:hover{transform:translateY(-1px);border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
  .plat.douyin{color:#161823}
  .plat.xhs{color:#ff2442}
  .plat.bili{color:#00a1d6}
  .plat.weibo{color:#e6162d}
  .plat.yt{color:#ff0000}
  .plat.ig{color:#e4405f}

  /* ---------- jobs ---------- */
  .jobs-head{display:flex;align-items:center;gap:8px;margin:32px 4px 14px}
  .jobs-head h2{font-size:13.5px;letter-spacing:.02em;color:var(--muted);font-weight:600;margin:0}
  .count{
    font-size:11.5px;font-weight:600;color:#5a6485;background:#e9edfa;
    border-radius:999px;padding:2px 8px;min-width:22px;text-align:center;
  }
  .clear{
    margin-left:auto;font-size:12.5px;color:var(--muted);cursor:pointer;
    background:none;border:none;font-family:inherit;padding:6px 8px;border-radius:8px;
    transition:color .15s, background .15s;
  }
  .clear:hover{color:var(--err);background:var(--err-bg)}

  .job{
    display:flex;gap:14px;align-items:center;
    background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);
    transition:box-shadow .2s, border-color .2s, transform .2s;
    animation:rise .28s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .job:hover{box-shadow:var(--shadow-md);border-color:var(--line-strong)}

  .thumb{
    width:74px;height:74px;border-radius:14px;flex:none;overflow:hidden;
    background:linear-gradient(140deg,#eef2ff,#f7f8ff);
    border:1px solid var(--line);display:grid;place-items:center;position:relative;
  }
  .thumb video,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{width:26px;height:26px;color:#93a0c2}

  .meta{flex:1;min-width:0}
  .name{
    font-size:15px;font-weight:650;letter-spacing:-.1px;color:var(--text);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35;
  }
  .url{
    font-size:12px;color:var(--muted-2);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-top:3px;
  }
  .bar{height:6px;border-radius:999px;background:#eef1f9;margin-top:10px;overflow:hidden}
  .bar > i{
    display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,#5b7bff,#8b5cf6);
    transition:width .4s cubic-bezier(.2,.8,.2,1);
  }
  .bar.done > i{background:linear-gradient(90deg,#34c79b,#0f9d6e)}
  .bar.hidden{display:none}
  .status-line{display:flex;gap:9px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;padding:3px 10px;border-radius:999px;font-weight:600;letter-spacing:.01em;
  }
  .badge.queued{background:#eef1f8;color:#67708c}
  .badge.running{background:#eef2ff;color:#3f5fe0}
  .badge.running::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  .badge.done{background:var(--ok-bg);color:var(--ok)}
  .badge.error{background:var(--err-bg);color:var(--err)}
  .remain{color:var(--muted-2)}
  .remain.soon{color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:999px}

  .note{
    display:flex;gap:6px;align-items:flex-start;margin-top:8px;
    font-size:12px;color:#5f6a8b;line-height:1.55;
  }
  .note svg{width:13px;height:13px;flex:none;margin-top:2px;color:#8b96bd}
  .err-msg{
    font-size:12.5px;color:var(--err);margin-top:8px;line-height:1.55;
    background:var(--err-bg);border-radius:10px;padding:8px 10px;word-break:break-word;
  }
  .logbox{margin-top:6px;font-size:12px;color:var(--muted)}
  .logbox summary{
    cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px;
    color:#8b93ab;padding:2px 0;user-select:none;
  }
  .logbox summary::-webkit-details-marker{display:none}
  .logbox summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:14px;line-height:1}
  .logbox[open] summary::before{transform:rotate(90deg)}
  .logbox summary:hover{color:var(--accent)}
  .logbox pre{
    margin:8px 0 0;padding:10px;border-radius:10px;background:#f7f8fc;border:1px solid var(--line);
    font-size:11.5px;line-height:1.5;color:#5d6785;white-space:pre-wrap;word-break:break-word;
    max-height:220px;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  .actions{display:flex;gap:8px;flex:none;align-self:center}
  .ico-btn{
    width:42px;height:42px;border-radius:13px;border:1px solid var(--line);
    background:#fff;color:#7c86a6;cursor:pointer;display:grid;place-items:center;
    transition:.16s;text-decoration:none;padding:0;
  }
  .ico-btn svg{width:18px;height:18px}
  .ico-btn:hover{color:var(--accent);border-color:#c3cdfd;background:#f6f8ff;transform:translateY(-1px)}
  .ico-btn.play{color:var(--accent);background:#f4f7ff;border-color:#dbe3ff}
  .ico-btn.play:hover{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 18px rgba(79,110,247,.30)}
  .ico-btn.del:hover{color:var(--err);border-color:#f6c4d2;background:var(--err-bg)}
  .ico-btn.retry:hover{color:var(--warn);border-color:#f5dca6;background:var(--warn-bg)}

  /* ---------- empty ---------- */
  .empty{text-align:center;padding:46px 16px 40px;color:var(--muted)}
  .empty-ico{
    width:68px;height:68px;margin:0 auto 14px;border-radius:22px;
    background:rgba(255,255,255,.8);border:1px solid var(--line);
    display:grid;place-items:center;box-shadow:var(--shadow-sm);color:#b3bcd6;
  }
  .empty-ico svg{width:28px;height:28px}
  .empty-t{font-size:14.5px;font-weight:600;color:var(--text-2)}
  .empty-s{font-size:12.5px;color:var(--muted-2);margin-top:5px}

  /* ---------- player modal ---------- */
  .modal{
    position:fixed;inset:0;background:rgba(18,23,38,.45);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:none;place-items:center;z-index:50;
    padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
            calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    overscroll-behavior:contain;
  }
  .modal.open{display:grid;animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal .inner{
    max-width:900px;width:100%;min-width:0;max-height:100%;overflow:auto;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    background:#fff;border-radius:22px;padding:14px;box-shadow:var(--shadow-lg);
  }
  .modal .mhead{display:flex;align-items:center;gap:12px;padding:2px 4px 12px}
  .modal .mhead .t{
    flex:1;min-width:0;
    font-weight:600;font-size:14px;color:var(--text-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .modal .close{
    margin-left:auto;width:34px;height:34px;flex:none;border-radius:50%;
    background:#f2f4fa;border:none;color:var(--muted);font-size:20px;line-height:1;
    cursor:pointer;display:grid;place-items:center;transition:.15s;
  }
  .modal .close:hover{background:#e9ecf5;color:var(--text)}
  /* 关键：不能同时写 width:100% + max-height，否则竖屏视频会被拉变形。
     让宽度/高度都由视频本身比例决定，再限制在可视区域内。 */
  .modal #mVideo{
    display:block;margin:0 auto;background:#0d1119;border-radius:14px;
    width:auto;height:auto;max-width:100%;max-height:min(78vh, 78dvh);
    object-fit:contain;
  }
  .modal #mImg{
    display:block;margin:0 auto;background:#0d1119;border-radius:14px;
    width:auto;height:auto;max-width:100%;max-height:min(78vh, 78dvh);
    object-fit:contain;
  }
  .modal .mhead .mdownload{display:grid;place-items:center;flex:none}
  .mnav{
    display:none;align-items:center;justify-content:center;gap:16px;row-gap:8px;
    flex-wrap:wrap;padding-top:12px;color:var(--muted);font-size:13px;font-weight:600;
  }
  /* 多图时给缩略图条留出高度，避免大图 + 缩略图把弹层撑出屏幕 */
  .modal .inner.has-thumbs #mImg,
  .modal .inner.has-thumbs #mVideo{max-height:min(62vh, 62dvh)}
  .mnav button{
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:#f6f8ff;color:var(--text-2);font-size:22px;line-height:1;
    cursor:pointer;display:grid;place-items:center;transition:.15s;
  }
  .mnav button:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .mnav button[disabled]{opacity:.35;cursor:not-allowed;background:#f2f4fa;color:var(--muted-2)}
  .mnav .mcount{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
  .mnav .mall{
    display:none;align-items:center;gap:6px;height:34px;padding:0 14px;
    border-radius:10px;background:var(--accent);color:#fff;font-size:12.5px;
    font-weight:600;text-decoration:none;transition:.15s;
  }
  .mnav .mall:hover{background:#3f5ee8;color:#fff}
  .mnav .mall svg{width:15px;height:15px}
  /* 多图缩略图条：点哪张就看哪张，右上角保存按钮保存当前这张 */
  .mthumbs{
    display:none;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;
    padding:10px 2px 2px;margin-top:2px;scrollbar-width:thin;
    -webkit-overflow-scrolling:touch;
  }
  .mthumbs button{
    position:relative;flex:none;width:64px;height:64px;padding:0;border-radius:10px;
    border:2px solid transparent;background:#f2f4fa;overflow:hidden;cursor:pointer;transition:.15s;
  }
  .mthumbs button:hover{border-color:#c3cdfd}
  .mthumbs button.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.14)}
  .mthumbs img,.mthumbs video{display:block;width:100%;height:100%;object-fit:cover}
  .mthumbs video{background:#0d1119}
  .mthumbs .vtag{
    position:absolute;right:4px;bottom:4px;width:17px;height:17px;border-radius:50%;
    background:rgba(13,17,25,.72);color:#fff;display:grid;place-items:center;
    pointer-events:none;
  }
  .mthumbs .vtag svg{width:9px;height:9px;fill:currentColor}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(16px);
    background:rgba(22,27,42,.94);color:#fff;padding:12px 20px;border-radius:14px;
    font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;
    transition:opacity .22s, transform .22s;box-shadow:0 14px 34px rgba(23,28,43,.28);
    z-index:80;max-width:calc(100vw - 40px);text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- 手机 H5 适配 ---------- */
  @media (max-width:720px){
    body{background-attachment:scroll}
    .wrap{
      padding:26px 14px calc(64px + env(safe-area-inset-bottom));
      padding-left:calc(14px + env(safe-area-inset-left));
      padding-right:calc(14px + env(safe-area-inset-right));
    }
    header{gap:12px;margin-bottom:18px}
    .logo{width:42px;height:42px;border-radius:13px}
    h1{font-size:19px}
    .sub{font-size:12px;margin-top:3px}
    .engine{display:none}

    .input-card{padding:12px;border-radius:20px}
    .composer{gap:8px}
    .field{flex:1 1 100%;height:52px;border-radius:14px}
    /* iOS Safari 输入框字号 <16px 会自动放大页面 */
    .field input{font-size:16px}
    select{flex:1 1 0;min-width:0;height:52px;font-size:16px;border-radius:14px;padding-right:34px;background-position:right 11px center}
    .btn{height:52px;font-size:16px;padding:0 26px;border-radius:14px}
    /* 手机上把 logo 行压缩成一行 */
    .support{gap:6px;font-size:12px;margin-top:13px}
    .plats{gap:5px}
    .plat{width:24px;height:24px;border-radius:8px}
    .plat svg{width:13px;height:13px}

    .jobs-head{margin:26px 4px 12px}
    .job{padding:12px;gap:12px;border-radius:16px;align-items:flex-start}
    .thumb{width:62px;height:62px;border-radius:12px;margin-top:2px}
    .name{font-size:14.5px}
    .url{font-size:11.5px}
    .bar{margin-top:9px}
    .status-line{margin-top:9px;font-size:12px;gap:7px}
    .ico-btn{width:44px;height:44px;border-radius:13px}   /* 触控目标 ≥44px */
    .modal{padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
    .modal .inner{padding:10px;border-radius:18px}
    .modal #mVideo{border-radius:12px}
    .modal .inner.has-thumbs #mImg,
    .modal .inner.has-thumbs #mVideo{max-height:min(52vh, 52dvh)}
    .mnav{gap:10px}
    .mnav .mall{height:32px;padding:0 12px;font-size:12px}
    .mthumbs button{width:56px;height:56px}
    .toast{font-size:13px;padding:11px 18px}
  }
  /* 窄屏：操作按钮换到第二行，标题不再被挤压 */
  @media (max-width:560px){
    .job{flex-wrap:wrap}
    .meta{flex:1 1 0}
    .actions{flex:1 1 100%;justify-content:flex-end;gap:8px;padding-top:2px}
  }
  @media (max-width:400px){
    .thumb{width:56px;height:56px}
    .name{font-size:14px}
    .badge{font-size:11px;padding:3px 9px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
      </svg>
    </div>
    <div class="brand">

<script>
const $ = (s)=>document.querySelector(s);
const el = (t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e;};
let POLL = null;

const ICON = {
  clip: `<svg class="ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>`,
  music:`<svg class="ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
  play: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`,
  dl:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>`,
  del:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>`,
  retry:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>`,
  info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>`,
  gallery:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.4"/><path d="m20.5 15.5-4.5-4.5L5.5 21.5"/></svg>`
};

function toast(msg, ms=2200){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), ms);
}
function humanSize(b){
  if(!b) return "";
  const u=["B","KB","MB","GB"]; let i=0; let n=b;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return n.toFixed(n<10&&i>0?1:0)+" "+u[i];
}
function remainText(ms){
  if(ms==null) return "";
  if(ms<=0) return "即将清理";
  const s=Math.floor(ms/1000);
  const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60);
  if(d>0) return `${d}天${h}小时后清理`;
  if(h>0) return `${h}小时${m}分后清理`;
  if(m>0) return `${m}分钟后清理`;
  return `${s}秒后清理`;
}
function isVideo(name){return /\.(mp4|m4v|webm|mkv|mov)$/i.test(name);}
function isAudio(name){return /\.(mp3|m4a|opus|ogg)$/i.test(name);}
function isImage(name){return /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(name);}
function hostOf(u){
  try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return ""; }
}
// 逐段编码，标题里的 # ? & 之类的字符不会把链接截断
function fileUrl(rel){return "/files/"+String(rel).split("/").map(encodeURIComponent).join("/");}

async function health(){
  try{
    const r = await fetch("/api/health"); const j = await r.json();
    $("#engineDot").className="dot"+(j.ok?"":" bad");
    $("#engineTxt").textContent = "yt-dlp "+(j.yt_dlp||"?");
    if(j.retention_hours>0){
      const h = j.retention_hours;
      const label = h%24===0 ? (h/24)+" 天" : h+" 小时";
      $("#engine").title = "文件在服务器保留 " + label + "，到期自动删除";
    }
  }catch(e){
    $("#engineDot").className="dot bad"; $("#engineTxt").textContent="离线";
  }
}

// 从分享文案里抠链接（抖音/小红书/B站 App 复制出来的是整段文字）
function extractUrl(text){
  const m = String(text||"").match(/https?:\/\/[^\s<>"'，。、；！？【】（）()\[\]{}「」『』《》　㐀-䶿一-鿿＀-￯]+/);
  return m ? m[0].replace(/[.,;:!?)\]}>'"，。、；：！？）】」』》]+$/,"") : "";
}

async function createJob(url, quality){
  const r = await fetch("/api/fetch",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({url,quality})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"提交失败");
  return j;
}

async function submit(){
  const raw = $("#url").value.trim();
  if(!raw){ toast("请先粘贴链接或分享文案"); $("#url").focus(); return; }
  const url = extractUrl(raw);
  if(!url){ toast("没有找到链接，请粘贴包含 http(s) 链接的内容"); return; }
  const q = $("#quality").value;
  $("#go").disabled=true;
  try{
    await createJob(url, q);
    $("#url").value="";
    toast("已加入下载队列");
    refresh();
    startPoll();
  }catch(e){ toast(e.message); }
  finally{ $("#go").disabled=false; }
}

// id -> 卡片节点。轮询时原地更新，不再整列表重绘——重绘会让卡片入场动画
// 和缩略图反复重播，看起来就是"一闪一闪"。
const cards = new Map();

function setText(node, text){
  if(node.textContent !== text) node.textContent = text;
}

function jobCard(job){
  const card = el("div","card job");
  card.dataset.id = job.id;

  const thumb = el("div","thumb"); card.appendChild(thumb);

  const meta = el("div","meta");
  const name = el("div","name"); meta.appendChild(name);
  const urlEl = el("div","url"); meta.appendChild(urlEl);

  const bar = el("div","bar");
  const fill = el("i"); bar.appendChild(fill); meta.appendChild(bar);

  const sl = el("div","status-line");
  const badge = el("span","badge"); sl.appendChild(badge);
  const info = el("span"); sl.appendChild(info);
  const remain = el("span","remain"); remain.style.display = "none"; sl.appendChild(remain);
  meta.appendChild(sl);

  // 失败信息、原始输出、转码提示都先建好再按状态显隐，
  // 这样状态切换时卡片结构不变，也就不会闪。
  const errEl = el("div","err-msg"); errEl.style.display = "none"; meta.appendChild(errEl);
  const det = el("details","logbox"); det.style.display = "none";
  const sum = el("summary"); sum.textContent = "yt-dlp 输出"; det.appendChild(sum);
  const pre = el("pre"); det.appendChild(pre);
  meta.appendChild(det);
  const noteEl = el("div","note"); noteEl.innerHTML = ICON.info;
  const noteSpan = el("span"); noteEl.appendChild(noteSpan);
  noteEl.style.display = "none"; meta.appendChild(noteEl);

  card.appendChild(meta);

  const actions = el("div","actions"); card.appendChild(actions);

  card._refs = {thumb, name, urlEl, bar, fill, badge, info, remain,
                errEl, det, pre, noteEl, noteSpan, actions,
                thumbSig: null, actionsSig: null, logText: "", noteText: ""};
  updateCard(card, job);
  return card;
}

function updateCard(card, job){
  const r = card._refs;
  const files = job.files || [];
  const file = files[0] || null;
  const imgs = files.filter(f=>isImage(f.name));
  const live = files.filter(f=>f.live);          // 实况动图（mp4）
  const media = files.filter(f=>isImage(f.name) || f.live);  // 静图 + 动图
  const archive = job.archive || null;

  // 缩略图只在文件真正变化时重建：轮询不会让 <video> 反复加载
  const thumbSig = job.status + "|" + (file ? file.rel : "") + "|" + (job.thumb||"") + "|" + media.length + "|" + live.length + "|" + (archive||"");
  if(r.thumbSig !== thumbSig){
    r.thumbSig = thumbSig;
    r.thumb.onclick = null;
    r.thumb.style.cursor = "";
    if(job.status==="done" && media.length){
      // 图文任务：点缩略图看大图/动图，逐项保存
      const first = media[0];
      r.thumb.innerHTML = (isVideo(first.name) && !job.thumb)
        ? `<video src="${fileUrl(first.rel)}#t=0.1" muted preload="metadata" playsinline webkit-playsinline></video>`
        : `<img src="${fileUrl(job.thumb || first.rel)}" alt="">`;
      r.thumb.style.cursor = "pointer";
      r.thumb.onclick = ()=>openGallery(job.filename || first.name, media, 0, archive);
    }else if(job.status==="done" && file && isVideo(file.name)){
      // 服务器用 ffmpeg 抽好的一帧；<video> 当缩略图在 iOS 上只会是黑块
      r.thumb.innerHTML = job.thumb
        ? `<img src="${fileUrl(job.thumb)}" alt="">`
        : `<video src="${fileUrl(file.rel)}#t=0.1" muted preload="metadata" playsinline webkit-playsinline"></video>`;
    }else if(job.status==="done" && file && isImage(file.name)){
      r.thumb.innerHTML = `<img src="${fileUrl(file.rel)}" alt="">`;
    }else if(job.status==="done" && file && isAudio(file.name)){
      r.thumb.innerHTML = ICON.music;
    }else{
      r.thumb.innerHTML = ICON.clip;
    }
  }

  // 完成前用来源域名做标题（比"解析中…+一整条 URL"清爽得多）
  const fallback = job.status==="error" ? "下载失败" : (hostOf(job.url) || "正在解析…");
  setText(r.name, job.filename || fallback);
  r.name.title = r.name.textContent;
  setText(r.urlEl, job.url);
  r.urlEl.title = job.url;

  r.bar.className = "bar" + (job.status==="done" ? " done" : (job.status==="error" ? " hidden" : ""));
  r.fill.style.width = (job.status==="done" ? 100 : (job.progress||0)) + "%";

  const label = {queued:"排队中",running:"下载中",done:"已完成",error:"失败"}[job.status]||job.status;
  if(r.badge.className !== "badge "+job.status) r.badge.className = "badge "+job.status;
  setText(r.badge, label);

  let info = "";
  if(job.status==="running"){
    info = job.phase==="converting" ? "转码中…" : (job.phase==="merging" ? "合并中…" : `${Math.round(job.progress||0)}%`);
  }else if(job.status==="queued"){
    info = "等待开始";
  }else if(job.status==="done" && media.length){
    const total = media.reduce((n,f)=>n+(f.size||0), 0);
    let label = "";
    if(media.length > 1){
      label = (live.length === media.length)
        ? `${media.length} 个动图`
        : `${media.length} 项` + (live.length ? `（含 ${live.length} 个动图）` : "");
    }else if(live.length){
      label = "动图";
    }
    info = (label ? label + " · " : "") + humanSize(total);
  }else if(job.status==="done" && file){
    info = humanSize(file.size);
  }
  setText(r.info, info);
  r.info.style.display = info ? "" : "none";

  if((job.status==="done"||job.status==="error") && job.expires){
    const left = job.expires - Date.now();
    setText(r.remain, "⏳ " + remainText(left));
    r.remain.classList.toggle("soon", left < 3600*1000);
    r.remain.style.display = "";
  }else{
    r.remain.style.display = "none";
  }

  const hasErr = job.status==="error" && !!job.error;
  r.errEl.style.display = hasErr ? "" : "none";
  if(hasErr) setText(r.errEl, job.error);

  const log = hasErr ? (job.log||"") : "";
  r.det.style.display = log ? "" : "none";
  if(r.logText !== log){
    r.logText = log;
    r.pre.textContent = log;
    if(!log) r.det.open = false;
  }

  // 后端的转码/兼容性提示（"已是 H.264，无需转码" / "转码为 H.264/AAC…"）
  const note = job.status!=="error" ? ((job.notes||[]).slice(-1)[0]||"") : "";
  r.noteEl.style.display = note ? "flex" : "none";
  if(r.noteText !== note){
    r.noteText = note;
    r.noteSpan.textContent = note;
    r.noteEl.title = note;
  }

  // 操作按钮只在状态/文件变化时重建，避免每次轮询重绑事件
  const actionsSig = job.status + "|" + (file ? file.rel : "") + "|" + media.length + "|" + live.length + "|" + (archive||"");
  if(r.actionsSig !== actionsSig){
    r.actionsSig = actionsSig;
    r.actions.innerHTML = "";
    if(job.status==="done" && file){
      const liveRels = new Set(live.map(f=>f.rel));
      const videoFile = files.find(f=>isVideo(f.name) && !liveRels.has(f.rel)) || null;
      if(videoFile){
        const play = el("button","ico-btn play"); play.title="播放"; play.setAttribute("aria-label","播放");
        play.innerHTML = ICON.play;
        play.onclick = ()=>openPlayer(videoFile.name, fileUrl(videoFile.rel));
        r.actions.appendChild(play);
      }
      if(media.length){
        const gal = el("button","ico-btn play");
        gal.title = media.length > 1 ? `查看全部 ${media.length} 项` : (live.length ? "查看动图" : "查看图片");
        gal.setAttribute("aria-label", gal.title);
        gal.innerHTML = ICON.gallery;
        gal.onclick = ()=>openGallery(job.filename || media[0].name, media, 0, archive);
        r.actions.appendChild(gal);
      }
      // 多项任务下载 zip（一次保存全部），单项/视频直接保存对应文件
      const target = archive ? fileUrl(archive)+"?dl=1"
        : fileUrl(videoFile ? videoFile.rel : (media.length ? media[0].rel : file.rel))+"?dl=1";
      const dl = el("a","ico-btn"); dl.title = archive ? "下载全部（zip）" : "下载";
      dl.setAttribute("aria-label", dl.title);
      dl.href = target;
      if(!archive) dl.download = videoFile ? videoFile.name : (media.length ? media[0].name : file.name);
      dl.innerHTML = ICON.dl;
      r.actions.appendChild(dl);
    }
    if(job.status==="error"){
      const retry = el("button","ico-btn retry"); retry.title="重新下载"; retry.setAttribute("aria-label","重新下载");
      retry.innerHTML = ICON.retry;
      retry.onclick = async ()=>{
        retry.disabled = true;
        try{ await createJob(job.url, job.quality||"best"); toast("已重新加入队列"); refresh(); startPoll(); }
        catch(e){ toast(e.message); }
        finally{ retry.disabled = false; }
      };
      r.actions.appendChild(retry);
    }
    const del = el("button","ico-btn del"); del.title="删除"; del.setAttribute("aria-label","删除");
    del.innerHTML = ICON.del;
    del.onclick = ()=>deleteJob(job.id);
    r.actions.appendChild(del);
  }
}

function emptyState(){
  return `<div class="empty">
    <div class="empty-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/></svg></div>
    <div class="empty-t">还没有任务</div>
    <div class="empty-s">粘贴一条链接或分享文案，服务器会帮你下载</div>
  </div>`;
}

function renderJobs(jobs){
  const box = $("#jobs");
  $("#jobCount").textContent = jobs.length;
  // 没有已完成/失败的任务时，不显示"清除已完成"
  const finished = jobs.some(j=> j.status==="done" || j.status==="error");
  $("#clearDone").style.visibility = finished ? "visible" : "hidden";

  if(!jobs.length){
    cards.clear();
    box.innerHTML = emptyState();
    return;
  }
  const empty = box.querySelector(".empty");
  if(empty) empty.remove();

  const seen = new Set();
  const nodes = [];
  jobs.forEach(job=>{
    let card = cards.get(job.id);
    if(card){
      updateCard(card, job);   // 原地更新，不重建节点
    }else{
      card = jobCard(job);
      cards.set(job.id, card);
    }
    seen.add(job.id);
    nodes.push(card);
  });
  for(const [id, card] of [...cards]){
    if(!seen.has(id)){ card.remove(); cards.delete(id); }
  }
  // DOM 顺序与列表保持一致。从后往前塞：新任务插到最前面，
  // 已有的节点不动——移动节点也可能重播入场动画。
  let next = null;
  for(let i = nodes.length - 1; i >= 0; i--){
    const node = nodes[i];
    if(node.parentNode !== box || node.nextSibling !== next){
      box.insertBefore(node, next);
    }
    next = node;
  }
}

async function refresh(){
  try{
    const r = await fetch("/api/jobs"); const j = await r.json();
    renderJobs(j.jobs||[]);
    const active = (j.jobs||[]).some(x=>x.status==="queued"||x.status==="running");
    if(active) startPoll(); else stopPoll();
  }catch(e){}
}

function startPoll(){
  if(POLL) return;
  POLL = setInterval(refresh, 1200);
}
function stopPoll(){ if(POLL){clearInterval(POLL);POLL=null;} }

async function deleteJob(id){
  await fetch("/api/job/"+id, {method:"DELETE"});
  refresh();
}

// 看图弹层：多图任务显示缩略图条，点哪张看哪张；右上角保存当前这一张，
// 底部"全选下载全部"一次保存 zip（后端已为多图任务打好包）。
let GAL = {files:[], i:0, name:"", archive:null};

function galMove(delta){
  if(GAL.files.length < 2) return;
  GAL.i = (GAL.i + delta + GAL.files.length) % GAL.files.length;
  showGallery();
}
function renderThumbs(){
  const box = $("#mThumbs");
  box.innerHTML = "";
  if(GAL.files.length < 2){ box.style.display = "none"; return; }
  box.style.display = "flex";
  GAL.files.forEach((f, idx)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.title = `第 ${idx+1} ${f.live ? "个动图" : "张"}`;
    b.setAttribute("aria-label", b.title);
    if(isVideo(f.name)){
      // 动图缩略图用视频首帧；右下角加播放角标，黑帧时也能看出是动图
      const v = document.createElement("video");
      v.src = fileUrl(f.rel) + "#t=0.1";
      v.muted = true;
      v.preload = "metadata";
      v.playsInline = true;
      v.setAttribute("playsinline", "");
      v.setAttribute("webkit-playsinline", "");
      b.appendChild(v);
      const tag = document.createElement("span");
      tag.className = "vtag";
      tag.innerHTML = ICON.play;
      b.appendChild(tag);
    }else{
      const im = document.createElement("img");
      im.src = fileUrl(f.rel);
      im.alt = "";
      im.loading = "lazy";         // 图多时只加载可视附近的缩略图
      im.decoding = "async";
      b.appendChild(im);
    }
    b.onclick = ()=>{ GAL.i = idx; showGallery(); };
    box.appendChild(b);
  });
}
function showGallery(){
  const n = GAL.files.length, f = GAL.files[GAL.i];
  if(!f) return;
  $("#mTitle").textContent = GAL.name;

  const v = $("#mVideo"), img = $("#mImg");
  if(isVideo(f.name)){
    // 实况动图：静音循环播放；普通视频（混合任务）不循环
    img.style.display = "none"; img.removeAttribute("src");
    v.style.display = ""; v.loop = !!f.live; v.muted = true;
    v.src = fileUrl(f.rel);
    v.play().catch(()=>{});
  }else{
    v.pause(); v.removeAttribute("src"); v.load(); v.style.display = "none";
    img.style.display = ""; img.src = fileUrl(f.rel);
  }

  // 选中态 + 把当前缩略图滚到中间
  const thumbs = $("#mThumbs").children;
  for(let i=0; i<thumbs.length; i++) thumbs[i].classList.toggle("on", i===GAL.i);
  if(thumbs[GAL.i] && $("#mThumbs").style.display !== "none")
    thumbs[GAL.i].scrollIntoView({block:"nearest", inline:"center"});

  $("#mCount").textContent = n > 1
    ? `${GAL.i+1} / ${n}` + (f.live ? " · 动图" : "")
    : (f.live ? "动图" : "");
  $("#mPrev").disabled = n < 2;
  $("#mNext").disabled = n < 2;

  const dl = $("#mDownload");
  dl.style.display = "";
  dl.href = fileUrl(f.rel) + "?dl=1";
  dl.download = f.name;
  dl.title = n > 1
    ? `保存第 ${GAL.i+1} ${f.live ? "个动图" : "张"}`
    : (f.live ? "保存这个动图" : "保存这张");
  dl.setAttribute("aria-label", dl.title);
  dl.innerHTML = ICON.dl;

  const all = $("#mDownloadAll");
  if(n > 1){
    all.style.display = "inline-flex";
    all.innerHTML = ICON.dl + `<span>全选下载全部（${n}）</span>`;
    if(GAL.archive){
      all.href = fileUrl(GAL.archive) + "?dl=1";
      all.removeAttribute("download");   // 让服务端 Content-Disposition 决定 zip 文件名
    }else{
      all.removeAttribute("href");       // 没有 zip 时逐张触发下载
    }
  }else{
    all.style.display = "none";
    all.removeAttribute("href");
  }
}
function downloadAllImages(){
  const files = GAL.files.slice();
  files.forEach((f, idx)=>{
    setTimeout(()=>{
      const a = document.createElement("a");
      a.href = fileUrl(f.rel) + "?dl=1";
      a.download = f.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, idx * 350);
  });
  toast(`开始下载 ${files.length} 项`);
}
function openGallery(name, files, start=0, archive=null){
  GAL = {files, i: Math.max(0, Math.min(start, files.length-1)), name: name || "图片",
         archive: archive || null};
  const v = $("#mVideo");
  v.pause(); v.removeAttribute("src"); v.load();
  v.loop = false; v.muted = false; v.style.display = "none";
  $("#mImg").style.display = "";
  $(".modal .inner").classList.toggle("has-thumbs", files.length > 1);
  $("#mNav").style.display = files.length > 1 ? "flex" : "none";
  renderThumbs();
  $("#modal").classList.add("open");
  showGallery();
}
function openPlayer(title, src){
  GAL = {files:[], i:0, name:"", archive:null};
  $("#mTitle").textContent = title;
  $("#mImg").style.display = "none"; $("#mImg").src = "";
  $(".modal .inner").classList.remove("has-thumbs");
  $("#mThumbs").style.display = "none"; $("#mThumbs").innerHTML = "";
  $("#mNav").style.display = "none";
  $("#mDownload").style.display = "none"; $("#mDownload").removeAttribute("href");
  $("#mDownloadAll").style.display = "none"; $("#mDownloadAll").removeAttribute("href");
  const v = $("#mVideo");
  v.loop = false; v.muted = false; v.style.display = ""; v.src = src;
  $("#modal").classList.add("open");
  v.play().catch(()=>{});
}
function closeModal(){
  $("#modal").classList.remove("open");
  const v = $("#mVideo");
  v.pause(); v.removeAttribute("src"); v.load(); v.loop = false; v.muted = false;
  $("#mImg").src = "";
  $(".modal .inner").classList.remove("has-thumbs");
  $("#mThumbs").innerHTML = "";
  $("#mDownloadAll").style.display = "none"; $("#mDownloadAll").removeAttribute("href");
  GAL = {files:[], i:0, name:"", archive:null};
}
$("#mPrev").onclick = ()=>galMove(-1);
$("#mNext").onclick = ()=>galMove(1);
$("#mDownloadAll").onclick = (e)=>{
  if(GAL.archive) return;          // 有 zip：走链接默认下载
  e.preventDefault();
  downloadAllImages();             // 没有 zip：逐张触发下载
};
$("#mClose").onclick = closeModal;
$("#modal").onclick = (e)=>{ if(e.target.id==="modal") closeModal(); };
document.addEventListener("keydown", e=>{
  if(!$("#modal").classList.contains("open")) return;
  if(e.key==="Escape") closeModal();
  else if(GAL.files.length > 1 && e.key==="ArrowLeft") galMove(-1);
  else if(GAL.files.length > 1 && e.key === "ArrowRight") galMove(1);
});

$("#go").onclick = submit;
$("#url").addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
$("#clearDone").onclick = async ()=>{
  const r = await fetch("/api/jobs"); const j = await r.json();
  for(const job of (j.jobs||[])){
    if(job.status==="done"||job.status==="error"){ await fetch("/api/job/"+job.id,{method:"DELETE"}); }
  }
  refresh();
};

health(); refresh(); startPoll();
</script>
